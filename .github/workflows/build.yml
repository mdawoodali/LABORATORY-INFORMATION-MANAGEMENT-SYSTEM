name: "Build Tauri App"

on:
  push:
    branches:
      - main

jobs:
  build-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Update Version Numbers
        run: |
          node -e "const fs = require('fs'); const version = '0.1.${{ github.run_number }}'; const tauriConf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json')); tauriConf.version = version; fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauriConf, null, 2)); const pkg = JSON.parse(fs.readFileSync('package.json')); pkg.version = version; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: "v0.1.${{ github.run_number }}"
          releaseName: "SR-LAB Windows Executable (v0.1.${{ github.run_number }})"
          releaseBody: "Automated build triggered by a push to main."
          releaseDraft: false
          prerelease: true
          args: "--target x86_64-pc-windows-msvc"
